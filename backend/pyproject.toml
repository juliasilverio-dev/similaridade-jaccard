[project]
name = "similaridade-jaccard-backend"
version = "0.1.0"
description = "Comparação explicável de dois documentos com Flask e Jaccard."
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4"]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
